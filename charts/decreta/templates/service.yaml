apiVersion: v1
kind: Service
metadata:
  name: {{ include "decreta.fullname" . }}
  labels:
    {{- include "decreta.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "decreta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 4000
