apiVersion: v1
kind: Secret
metadata:
  name: {{ include "decreta.fullname" . }}
  labels:
    {{- include "decreta.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret zorunlu (openssl rand -base64 48)" .Values.secrets.jwtSecret | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "postgres.password zorunlu" .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.secrets.adminPassword }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}
