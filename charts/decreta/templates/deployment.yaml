apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decreta.fullname" . }}
  labels:
    {{- include "decreta.labels" . | nindent 4 }}
spec:
  # Container başlangıçta migration çalıştırır; çok replika yarışır. Ölçeklemeden
  # önce migration'ı ayrı Job'a alıp uygulamada kapatmak gerekir.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "decreta.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "decreta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: decreta
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: {{ include "decreta.fullname" . }}
            - secretRef:
                name: {{ include "decreta.fullname" . }}
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
